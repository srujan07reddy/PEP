[project]
name = "pep-mcp"
version = "0.1.0"
description = "Product Engineering Platform MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pyyaml"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pep-mcp = "server:main"
