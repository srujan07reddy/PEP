apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core
  template:
    metadata:
      labels:
        app: core
    spec:
      containers:
      - name: core
        image: school_erp-core:latest
        ports:
        - containerPort: 8000
