[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pep"
version = "0.1.0"
description = "Product Engineering Platform"
dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "neo4j>=5.14.0",
    "qdrant-client>=1.7.0",
    "langgraph",
    "docling",
    "unstructured[all-docs]",
    "tika",
    "pytesseract",
    "pdf2image",
    "Pillow",
    "pm4py",
    "pandas",
    "requests"
]
